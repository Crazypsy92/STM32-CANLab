name: Firmware Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ARM GNU toolchain
        run: |
          # The runner image may include a Microsoft package feed that is not
          # needed by this firmware build and can intermittently return HTTP 403.
          for source in /etc/apt/sources.list.d/*; do
            if [ -f "$source" ] && grep -q 'packages.microsoft.com' "$source"; then
              sudo rm -f "$source"
            fi
          done
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            binutils-arm-none-eabi \
            libnewlib-arm-none-eabi \
            cmake \
            ninja-build

      - name: Configure Debug
        run: cmake --preset Debug

      - name: Build Debug
        run: cmake --build --preset Debug --parallel

      - name: Report firmware size
        run: arm-none-eabi-size build/Debug/stm32_canlab.elf

      - name: Configure Release
        run: cmake --preset Release

      - name: Build Release
        run: cmake --build --preset Release --parallel
